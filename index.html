<style>
  :root {
    --paper: #FBF9F5;
    --card: #FFFFFF;
    --sunk: #F1EDE6;
    --ink: #1A1A18;
    --ink-2: #5A5850;
    --ink-3: #8C8A80;
    --line: #E4DED3;
    --indigo: #23407A;
    --indigo-2: #2E5A9E;
    --indigo-3: #4C7FC4;
    --coral: #C2410C;
    --amber: #D97706;
    --green: #2F7A5A;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(26, 26, 24, .04), 0 8px 24px -16px rgba(26, 26, 24, .18);
    --ease: cubic-bezier(.22, .61, .36, 1);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "PingFang SC", "思源黑体", "Source Han Sans SC", "Noto Sans SC",
                 "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* 纸感底纹：极淡的暖色渐层 */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(900px 500px at 12% -8%, rgba(76, 127, 196, .09), transparent 62%),
      radial-gradient(700px 420px at 92% 4%, rgba(217, 119, 6, .07), transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .shell {
    position: relative;
    z-index: 1;
    max-width: 560px;
    margin: 0 auto;
    padding: 0 18px calc(88px + env(safe-area-inset-bottom));
  }

  /* ---------- 头部 ---------- */
  .head {
    position: sticky;
    top: 0;
    z-index: 20;
    margin: 0 -18px;
    padding: 18px 18px 14px;
    background: rgba(251, 249, 245, .86);
    backdrop-filter: saturate(180%) blur(14px);
    -webkit-backdrop-filter: saturate(180%) blur(14px);
    border-bottom: 1px solid rgba(232, 227, 218, .7);
  }

  .head-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 14px;
  }

  .eyebrow {
    margin: 0 0 2px;
    font-size: 12px;
    letter-spacing: .08em;
    color: var(--ink-3);
    text-transform: uppercase;
  }

  h1 {
    margin: 0;
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -.01em;
    line-height: 1.2;
  }

  .range {
    margin: 6px 0 0;
    font-size: 13px;
    color: var(--ink-2);
    font-variant-numeric: tabular-nums;
  }

  /* 环形进度 */
  .ring {
    position: relative;
    width: 62px;
    height: 62px;
    flex: 0 0 auto;
    margin-top: 2px;
  }

  .ring svg { transform: rotate(-90deg); display: block; }

  .ring .track { stroke: var(--sunk); }
  .ring .bar {
    stroke: var(--indigo);
    stroke-linecap: round;
    transition: stroke-dashoffset .9s var(--ease);
  }

  .ring-label {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
  }

  .ring-num {
    font-size: 15px;
    font-weight: 600;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  .ring-cap {
    font-size: 9px;
    color: var(--ink-3);
    letter-spacing: .06em;
    margin-top: 2px;
  }

  .meta {
    margin: 10px 0 0;
    font-size: 11.5px;
    color: var(--ink-3);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .dot-live {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 0 3px rgba(47, 122, 90, .14);
  }

  /* ---------- 指标条 ---------- */
  .stats {
    display: flex;
    gap: 8px;
    margin: 16px 0 4px;
    overflow-x: auto;
    scrollbar-width: none;
  }

  .stats::-webkit-scrollbar { display: none; }

  .pill {
    flex: 1 0 auto;
    min-width: 96px;
    padding: 10px 13px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: var(--shadow);
  }

  .pill-label {
    font-size: 11px;
    color: var(--ink-3);
    letter-spacing: .04em;
    white-space: nowrap;
  }

  .pill-value {
    margin-top: 2px;
    font-size: 19px;
    font-weight: 600;
    letter-spacing: -.01em;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .pill.is-alert .pill-value { color: var(--coral); }
  .pill.is-alert { border-color: rgba(194, 65, 12, .28); background: rgba(194, 65, 12, .045); }

  .pill.is-alert .dot-breathe {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--coral);
    margin-left: 5px;
    vertical-align: middle;
    animation: breathe 2.4s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { opacity: .35; transform: scale(.86); }
    50% { opacity: 1; transform: scale(1.12); }
  }

  /* ---------- 分组 ---------- */
  .group { margin-top: 22px; }

  .group-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 9px;
    padding-left: 2px;
  }

  .group-title {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .04em;
    color: var(--ink-2);
  }

  .badge-count {
    min-width: 18px;
    height: 18px;
    padding: 0 6px;
    border-radius: 9px;
    background: var(--sunk);
    color: var(--ink-2);
    font-size: 11px;
    font-weight: 600;
    line-height: 18px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }

  .group-head.is-overdue .group-title { color: var(--coral); }
  .group-head.is-overdue .badge-count { background: rgba(194, 65, 12, .12); color: var(--coral); }

  /* ---------- 卡片 ---------- */
  .card {
    position: relative;
    display: flex;
    gap: 0;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 9px;
    overflow: hidden;
    cursor: pointer;
    transition: transform .15s var(--ease), border-color .15s var(--ease), box-shadow .15s var(--ease);
    animation: rise .34s var(--ease) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(7px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card:hover, .card:focus-visible {
    transform: translateX(2px);
    border-color: #D9D2C6;
    box-shadow: 0 2px 4px rgba(26, 26, 24, .05), 0 14px 32px -20px rgba(26, 26, 24, .28);
    outline: none;
  }

  .card:active { transform: translateX(3px) scale(.997); }

  .stem {
    width: 3px;
    flex: 0 0 3px;
    background: var(--indigo);
  }

  .card-body {
    flex: 1;
    min-width: 0;
    padding: 13px 14px 13px 13px;
  }

  .card-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }

  .card-main { min-width: 0; flex: 1; }

  .course {
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: .05em;
    color: var(--ink-3);
    text-transform: none;
    margin-bottom: 3px;
  }

  .task {
    font-size: 15.5px;
    font-weight: 500;
    line-height: 1.45;
    color: var(--ink);
    letter-spacing: -.005em;
    overflow-wrap: break-word;
  }

  .due-block {
    flex: 0 0 auto;
    text-align: right;
    padding-top: 1px;
  }

  .due-date {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -.01em;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .due-delta {
    display: inline-block;
    margin-top: 4px;
    padding: 1px 7px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
    background: var(--sunk);
    color: var(--ink-2);
  }

  .is-overdue .due-date { color: var(--coral); }
  .is-overdue .due-delta { background: rgba(194, 65, 12, .1); color: var(--coral); }
  .is-today .due-date { color: var(--amber); }
  .is-today .due-delta { background: rgba(217, 119, 6, .12); color: #A35A05; }
  .is-pending .due-date { color: var(--ink-3); font-size: 13px; }
  .is-pending .due-delta { background: rgba(90, 88, 80, .09); }

  /* ---------- 卡片动作 ---------- */
  .card-actions {
    display: flex;
    gap: 8px;
    margin-top: 11px;
    padding-top: 9px;
    border-top: 1px dashed var(--line);
  }

  .act {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--paper);
    color: var(--ink-2);
    font-size: 12.5px;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    transition: background .16s var(--ease), color .16s var(--ease),
                border-color .16s var(--ease), transform .16s var(--ease);
  }

  .act::before {
    content: "";
    width: 9px;
    height: 9px;
    border: 1.6px solid currentColor;
    border-radius: 3px;
    opacity: .75;
  }

  .act:hover, .act:focus-visible {
    background: var(--indigo);
    border-color: var(--indigo);
    color: #fff;
    outline: none;
    transform: translateY(-1px);
  }

  .act:active { transform: translateY(0); }

  .meta-act {
    margin-left: auto;
    color: var(--indigo-2);
    font-weight: 600;
    text-decoration: none;
    font-size: 12px;
    padding: 2px 6px;
    border-radius: 6px;
    transition: background .16s var(--ease), color .16s var(--ease);
  }

  .meta-act:hover, .meta-act:focus-visible {
    background: rgba(46, 90, 158, .1);
    color: var(--indigo);
    outline: none;
  }

  .meta-act[hidden] { display: none; }

  /* 展开详情 */
  .detail {
    grid-template-rows: 0fr;
    display: grid;
    transition: grid-template-rows .24s var(--ease);
  }

  .card.open .detail { grid-template-rows: 1fr; }

  .detail-inner { overflow: hidden; }

  .detail-text {
    margin: 11px 0 0;
    padding-top: 11px;
    border-top: 1px dashed var(--line);
    font-size: 13px;
    line-height: 1.65;
    color: var(--ink-2);
  }

  .detail-meta {
    margin: 7px 0 0;
    font-size: 11.5px;
    color: var(--ink-3);
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .conf {
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .conf-bar {
    width: 26px;
    height: 3px;
    border-radius: 2px;
    background: var(--sunk);
    overflow: hidden;
  }

  .conf-fill { height: 100%; background: var(--indigo-3); }

  /* ---------- 空状态 ---------- */
  .empty {
    margin-top: 46px;
    text-align: center;
    animation: rise .4s var(--ease) both;
  }

  .empty svg { display: block; margin: 0 auto 14px; opacity: .9; }

  .empty h2 {
    margin: 0 0 6px;
    font-size: 17px;
    font-weight: 600;
    color: var(--ink);
  }

  .empty p {
    margin: 0;
    font-size: 13.5px;
    color: var(--ink-3);
  }

  /* ---------- 底部 ---------- */
  .foot {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 15;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    max-width: 560px;
    margin: 0 auto;
    padding: 11px 18px calc(11px + env(safe-area-inset-bottom));
    background: rgba(251, 249, 245, .92);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-top: 1px solid var(--line);
    font-size: 12px;
    color: var(--ink-2);
  }

  .foot-left { display: flex; align-items: center; gap: 6px; }

  .foot-icons { display: flex; align-items: center; gap: 10px; color: var(--ink-3); }

  .foot-icons span { display: inline-flex; align-items: center; gap: 4px; }

  /* ---------- 桌面 ---------- */
  @media (min-width: 768px) {
    .shell { max-width: 940px; padding-left: 32px; padding-right: 32px; }
    .head { margin-left: -32px; margin-right: -32px; padding-left: 32px; padding-right: 32px; }
    .column-list { column-count: 2; column-gap: 14px; }
    .column-list .card { break-inside: avoid; }
    .foot { max-width: 940px; padding-left: 32px; padding-right: 32px; }
    h1 { font-size: 30px; }
  }

  /* 窄屏防溢出：避免卡片被内容撑破、右侧截止日被横向裁切 */
  html, body { overflow-x: hidden; }
  .head-top > div:first-child { flex: 1; min-width: 0; }
  .card { width: 100%; }
  .card-body { overflow: hidden; }
  .card-row { min-width: 0; }
  .detail { min-width: 0; }
  .due-block { flex-shrink: 0; max-width: 46%; }
  .pill-value { font-size: 17px; }

  @media (max-width: 400px) {
    .due-date { font-size: 13.5px; }
    .due-delta { font-size: 10.5px; padding: 1px 6px; }
    .task { font-size: 14.5px; }
    .pill { min-width: 84px; padding: 9px 11px; }
    .pill-value { font-size: 16px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
    }
  }
</style>
</head>

    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // 写入通道用 GitHub Issue：不用在页面里放 token，也不用额外后端。
  // 点一下 → 预填好 issue → 提交 → Actions 把你的事办掉。
  function issueUrl(title, body) {
    if (!DATA.repo) return '';
    return 'https://github.com/' + DATA.repo + '/issues/new?title='
      + encodeURIComponent(title) + '&body=' + encodeURIComponent(body);
  }

  function doneUrl(it) {
    return issueUrl('[done] ' + it.id,
      '课程：' + (it.course || '') + '\n作业：' + (it.title || '') + '\n截止：' + (it.dueText || ''));
  }

  const addBtn = document.getElementById('addBtn');
  if (DATA.repo) {
    addBtn.hidden = false;
    addBtn.href = issueUrl('[add] 新作业',
      '把老师的话原样贴在这里，或写清楚课程 + 作业 + 截止时间。\n'
      + '例如：数据结构，下周三之前把第六章习题交到学习通。\n');
  }

  // 头部
  document.getElementById('todayLabel').textContent = DATA.todayLabel || '';
  document.getElementById('weekLabel').textContent = DATA.weekLabel || '';
  document.getElementById('updatedAt').textContent = DATA.updatedAt
    ? '更新于 ' + DATA.updatedAt
    : '数据已同步';

  // 进度环
  const stats = DATA.stats || { open: 0, done: 0, overdue: 0, nearest: '—' };
  const totalCount = (stats.open || 0) + (stats.done || 0);
  const ratio = totalCount ? Math.min(1, (stats.done || 0) / totalCount) : 0;
  const C = 2 * Math.PI * 27;
  const bar = document.getElementById('ringBar');
  bar.setAttribute('stroke-dasharray', C.toFixed(1));
  requestAnimationFrame(() => {
    bar.style.strokeDashoffset = (C * (1 - ratio)).toFixed(1);
  });

  // 数字滚动
  const ringNum = document.getElementById('ringNum');
  const target = stats.done || 0;
  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches && target > 0) {
    let cur = 0;
    const step = Math.max(1, Math.round(target / 14));
    const timer = setInterval(() => {
      cur += step;
      if (cur >= target) { cur = target; clearInterval(timer); }
      ringNum.textContent = cur;
    }, 34);
  } else {
    ringNum.textContent = target;
  }

  // 指标条
  const statsEl = document.getElementById('stats');
  const pills = [
    { label: '待办', value: stats.open || 0, alert: false },
    { label: '逾期', value: stats.overdue || 0, alert: (stats.overdue || 0) > 0 },
    { label: '最近截止', value: stats.nearest || '—', alert: false }
  ];
  statsEl.innerHTML = pills.map(p => `
    <div class="pill${p.alert ? ' is-alert' : ''}">
      <div class="pill-label">${esc(p.label)}</div>
      <div class="pill-value">${esc(p.value)}${p.alert ? '<i class="dot-breathe"></i>' : ''}</div>
    </div>`).join('');

  // 分组
  const groupsEl = document.getElementById('groups');
  const items = DATA.items || [];
  let rendered = 0;

  GROUPS.forEach(g => {
    const bucket = items.filter(it => it.group === g.key);
    if (!bucket.length) return;
    rendered += bucket.length;

    const section = document.createElement('section');
    section.className = 'group';

    const head = document.createElement('div');
    head.className = 'group-head' + (g.key === 'overdue' ? ' is-overdue' : '');
    head.innerHTML = `<span class="group-title">${esc(g.label)}</span>
                      <span class="badge-count">${bucket.length}</span>`;
    section.appendChild(head);

    const list = document.createElement('div');
    list.className = 'column-list';

    bucket.forEach((it, idx) => {
      const color = colorOf(it.course || '');
      const card = document.createElement('article');
      card.className = 'card is-' + g.key;
      card.style.animationDelay = (idx * 34) + 'ms';
      card.tabIndex = 0;

      const confPct = Math.round((it.confidence || 0) * 100);

      card.innerHTML = `
        <div class="stem" style="background:${color}"></div>
        <div class="card-body">
          <div class="card-row">
            <div class="card-main">
              <div class="course" style="color:${color}">${esc(it.course)}</div>
              <div class="task">${esc(it.title)}</div>
            </div>
            <div class="due-block">
              <div class="due-date">${esc(it.dueText)}</div>
              <div class="due-delta">${esc(it.delta)}</div>
            </div>
          </div>
          <div class="detail">
            <div class="detail-inner">
              <p class="detail-text">${esc(it.detail)}</p>
              <div class="detail-meta">
                <span class="conf">可信度
                  <span class="conf-bar"><span class="conf-fill" style="width:${confPct}%"></span></span>
                  ${confPct}%
                </span>
                ${it.timePhrase ? `<span>原文时间：${esc(it.timePhrase)}</span>` : ''}
              </div>
            </div>
          </div>
          ${DATA.repo ? `<div class="card-actions">
            <a class="act" href="${doneUrl(it)}" target="_blank" rel="noopener">标记完成</a>
          </div>` : ''}
        </div>`;

      const toggle = () => card.classList.toggle('open');
      card.addEventListener('click', toggle);
      card.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
      });

      // 动作按钮不该顺带把卡片展开
      card.querySelectorAll('a.act').forEach(a => {
        a.addEventListener('click', e => e.stopPropagation());
      });

      list.appendChild(card);
    });

    section.appendChild(list);
    groupsEl.appendChild(section);
  });

  if (!rendered) {
    document.getElementById('empty').hidden = false;
  }

  // 底部提醒文案
  const hour = new Date().getHours();
  document.getElementById('nextRemind').textContent =
    hour < 20 ? '下次提醒：今晚 20:00' : '下次提醒：明早 07:00';
})();
</script>
</body>
</html>
